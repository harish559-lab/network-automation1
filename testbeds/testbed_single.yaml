testbed:
  name: HFCL_Switch_Testbed
devices:
  HFCL:
    alias: switch
    type: switch
    os: linux
    platform: linux
    credentials:
      default:
        username: admin
        password: admin
    connections:
      cli:
        class: unicon.Unicon
        protocol: ssh
        ip: 192.168.89.61
        port: 22
        arguments:
          connection_timeout: 60
          ssh_options: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
        settings:
          EXEC_TIMEOUT: 60
          GRACEFUL_DISCONNECT_WAIT_SEC: 2
