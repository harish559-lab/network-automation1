---
# =============================================================
# Playbook : vlan_access_access.yml
# Purpose  : Configure Access-to-Access VLAN + Generate Traffic
#
# vars_files points to config/layer2/vlan_access_access.yaml
# which is AUTO-GENERATED by lib/ansible_inventory.py from
# config/lab_config.yaml — never edit either file directly.
# =============================================================

- name: "Access Port to Access Port VLAN Configuration"
  hosts: localhost
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../../config/layer2/vlan_access_access.yaml"

  vars:
    helper_script:   "{{ playbook_dir }}/../../../scripts/switch_cmd.py"
    sender_script:   "{{ playbook_dir }}/../../../scripts/traffic_sender.py"
    receiver_script: "{{ playbook_dir }}/../../../scripts/traffic_receiver.py"

  tasks:

  # ==========================================================
  # STEP 1 : Create VLAN
  # ==========================================================
  - name: "STEP 1 | Create VLAN {{ vlan_id }}"
    command: >
      python3 {{ helper_script }}
      {{ switch_ip }} {{ switch_user }} {{ switch_pass }}
      "configure terminal"
      "vlan {{ vlan_id }}"
      "name {{ vlan_name }}"
      "end"
    register: vlan_config

  - name: "STEP 1 | Display Output"
    debug:
      var: vlan_config.stdout_lines

  # ==========================================================
  # STEP 2 : Configure Access Port 1
  # ==========================================================
  - name: "STEP 2 | Configure {{ access_port1 }}"
    command: >
      python3 {{ helper_script }}
      {{ switch_ip }} {{ switch_user }} {{ switch_pass }}
      "configure terminal"
      "interface {{ access_port1 }}"
      "switchport mode access"
      "switchport access vlan {{ vlan_id }}"
      "no shutdown"
      "exit"
    register: port1_config

  - debug:
      var: port1_config.stdout_lines

  # ==========================================================
  # STEP 3 : Configure Access Port 2
  # ==========================================================
  - name: "STEP 3 | Configure {{ access_port2 }}"
    command: >
      python3 {{ helper_script }}
      {{ switch_ip }} {{ switch_user }} {{ switch_pass }}
      "configure terminal"
      "interface {{ access_port2 }}"
      "switchport mode access"
      "switchport access vlan {{ vlan_id }}"
      "no shutdown"
      "end"
    register: port2_config

  - debug:
      var: port2_config.stdout_lines

  # ==========================================================
  # STEP 4 : Save Configuration
  # ==========================================================
  - name: "STEP 4 | Save Configuration"
    command: >
      python3 {{ helper_script }}
      {{ switch_ip }} {{ switch_user }} {{ switch_pass }}
      "copy running-config startup-config"
    register: save_config

  - debug:
      var: save_config.stdout_lines

  # ==========================================================
  # STEP 5 : Collect VLAN Info
  # ==========================================================
  - name: "STEP 5 | Collect VLAN Information"
    command: >
      python3 {{ helper_script }}
      {{ switch_ip }} {{ switch_user }} {{ switch_pass }}
      "show vlan brief"
    register: vlan_output

  - debug:
      var: vlan_output.stdout_lines

  # ==========================================================
  # STEP 6 : Collect Interface Config
  # ==========================================================
  - name: "STEP 6 | Collect {{ access_port1 }} Config"
    command: >
      python3 {{ helper_script }}
      {{ switch_ip }} {{ switch_user }} {{ switch_pass }}
      "show running-config interface {{ access_port1 }}"
    register: port1_verify

  - debug:
      var: port1_verify.stdout_lines

  - name: "STEP 6 | Collect {{ access_port2 }} Config"
    command: >
      python3 {{ helper_script }}
      {{ switch_ip }} {{ switch_user }} {{ switch_pass }}
      "show running-config interface {{ access_port2 }}"
    register: port2_verify

  - debug:
      var: port2_verify.stdout_lines

  # ==========================================================
  # STEP 7 : Collect Interface Status
  # ==========================================================
  - name: "STEP 7 | Collect Interface Status"
    command: >
      python3 {{ helper_script }}
      {{ switch_ip }} {{ switch_user }} {{ switch_pass }}
      "show interface {{ access_port1 }} status"
      "show interface {{ access_port2 }} status"
    register: interface_status

  - debug:
      var: interface_status.stdout_lines

  # ==========================================================
  # STEP 8 : Start Receiver
  # ==========================================================
  - name: "STEP 8 | Start Receiver"
    command: >
      ssh -o StrictHostKeyChecking=no {{ receiver_host }}
      "nohup sudo python3 {{ receiver_script }}
      --interface {{ traffic_interface }}
      --timeout {{ traffic_timeout }}
      --report {{ receiver_report }}
      >/tmp/receiver.log 2>&1 &"

  - name: "STEP 8.1 | Wait for Receiver Startup"
    wait_for:
      timeout: 2

  # ==========================================================
  # STEP 8.2 : Send Traffic
  # ==========================================================
  - name: "STEP 8.2 | Send Untagged Traffic"
    command: >
      ssh -o StrictHostKeyChecking=no {{ sender_host }}
      "sudo python3 {{ sender_script }}
      --interface {{ traffic_interface }}
      --count {{ packet_count }}
      --interval {{ packet_interval }}
      --report {{ sender_report }}"
    register: sender_output

  # ==========================================================
  # STEP 8.3 : Wait for Receiver to Finish
  # Fix: cast traffic_timeout to int before arithmetic
  # ==========================================================
  - name: "STEP 8.3 | Wait for Receiver to Complete"
    wait_for:
      timeout: "{{ (traffic_timeout | int) + 5 }}"

  # ==========================================================
  # STEP 9 : Copy Reports
  # ==========================================================
  - name: "STEP 9 | Check Receiver Log"
    command: ssh -o StrictHostKeyChecking=no {{ receiver_host }} "cat /tmp/receiver.log"
    register: receiver_log
    ignore_errors: true

  - debug:
      var: receiver_log.stdout_lines

  - name: "STEP 9 | Copy Receiver Report"
    command: >
      scp -o StrictHostKeyChecking=no
      {{ receiver_host }}:{{ receiver_report }} /tmp/
    ignore_errors: true

  - name: "STEP 9 | Copy Sender Report"
    command: >
      scp -o StrictHostKeyChecking=no
      {{ sender_host }}:{{ sender_report }} /tmp/
    ignore_errors: true

  # ==========================================================
  # STEP 10 : Wait + Collect MAC Table
  # ==========================================================
  - name: "STEP 10 | Wait 5s for MAC Learning"
    wait_for:
      timeout: 5

  - name: "STEP 10 | Collect MAC Address Table"
    command: >
      python3 {{ helper_script }}
      {{ switch_ip }} {{ switch_user }} {{ switch_pass }}
      "show mac address-table vlan {{ vlan_id }}"
    register: mac_table

  - debug:
      var: mac_table.stdout_lines

  # ==========================================================
  # STEP 11 : Collect Interface Counters
  # ==========================================================
  - name: "STEP 11 | Statistics {{ access_port1 }}"
    command: >
      python3 {{ helper_script }}
      {{ switch_ip }} {{ switch_user }} {{ switch_pass }}
      "show interface {{ access_port1 }} statistics"
    register: counters_port1

  - debug:
      var: counters_port1.stdout_lines

  - name: "STEP 11 | Statistics {{ access_port2 }}"
    command: >
      python3 {{ helper_script }}
      {{ switch_ip }} {{ switch_user }} {{ switch_pass }}
      "show interface {{ access_port2 }} statistics"
    register: counters_port2

  - debug:
      var: counters_port2.stdout_lines

  # ==========================================================
  # STEP 12 : Generate Report
  # ==========================================================
  - name: "STEP 12 | Save Execution Report"
    copy:
      dest: "{{ execution_report }}"
      content: |
        ======================================================
               VLAN ACCESS TO ACCESS CONFIGURATION REPORT
        ======================================================
        Device        : {{ switch_ip }}
        VLAN ID       : {{ vlan_id }}
        VLAN Name     : {{ vlan_name }}
        Access Port 1 : {{ access_port1 }}
        Access Port 2 : {{ access_port2 }}
        ======================================================
        VLAN INFORMATION
        ======================================================
        {{ vlan_output.stdout }}
        ======================================================
        PORT 1 CONFIGURATION
        ======================================================
        {{ port1_verify.stdout }}
        ======================================================
        PORT 2 CONFIGURATION
        ======================================================
        {{ port2_verify.stdout }}
        ======================================================
        INTERFACE STATUS
        ======================================================
        {{ interface_status.stdout }}
        ======================================================
        MAC ADDRESS TABLE
        ======================================================
        {{ mac_table.stdout }}
        ======================================================
        INTERFACE COUNTERS PORT 1
        ======================================================
        {{ counters_port1.stdout }}
        ======================================================
        INTERFACE COUNTERS PORT 2
        ======================================================
        {{ counters_port2.stdout }}
        ======================================================
        NOTE: Validation performed separately by pyATS
        ======================================================

  - name: "STEP 12 | Done"
    debug:
      msg: "Complete. Report: {{ execution_report }}"
