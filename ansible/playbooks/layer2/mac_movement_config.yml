---
# =============================================================
# mac_movement_config.yml
# Verifies MAC movement between ports on HFCL switch
#
# Test Steps:
#   STEP 1 — Verify VLAN 1 exists (default VLAN)
#   STEP 2 — Verify Gi 1/1 and Gi 1/2 are in VLAN 1
#   STEP 3 — Capture MAC table before traffic
# =============================================================

- name: MAC Movement - Configuration & Verification
  hosts: localhost
  gather_facts: false

  vars:
    switch_ip:   "192.168.180.146"
    switch_user: "admin"
    switch_pass: "admin"
    test_mac:    "00:11:22:33:44:55"
    port1:       "GigabitEthernet 1/1"
    port2:       "GigabitEthernet 1/2"
    script_path: "{{ playbook_dir }}/../../../scripts/switch_cmd.py"

  tasks:

    # ----------------------------------------------------------
    # STEP 1 — Show VLAN info
    # ----------------------------------------------------------
    - name: "STEP 1 | Show VLAN information"
      command:
        argv:
          - python3
          - "{{ script_path }}"
          - "{{ switch_ip }}"
          - "{{ switch_user }}"
          - "{{ switch_pass }}"
          - "show vlan"
      register: vlan_output
      changed_when: true

    - name: "STEP 1 | Debug VLAN output"
      debug:
        var: vlan_output.stdout_lines

    # ----------------------------------------------------------
    # STEP 2 — Capture MAC table before traffic
    # ----------------------------------------------------------
    - name: "STEP 2 | Capture MAC table BEFORE traffic"
      command:
        argv:
          - python3
          - "{{ script_path }}"
          - "{{ switch_ip }}"
          - "{{ switch_user }}"
          - "{{ switch_pass }}"
          - "show mac address-table"
      register: mac_table_before
      changed_when: true

    - name: "STEP 2 | Debug MAC table before"
      debug:
        var: mac_table_before.stdout_lines

    # ----------------------------------------------------------
    # STEP 3 — Show interface status
    # ----------------------------------------------------------
    - name: "STEP 3 | Show interface status"
      command:
        argv:
          - python3
          - "{{ script_path }}"
          - "{{ switch_ip }}"
          - "{{ switch_user }}"
          - "{{ switch_pass }}"
          - "show interfaces status"
      register: intf_status
      changed_when: true

    - name: "STEP 3 | Debug interface status"
      debug:
        var: intf_status.stdout_lines

    - name: "STEP 3 | Done"
      debug:
        msg: "✅ MAC Movement pre-check completed. Ready for pyATS test."
