testbed:
  name: HFCL_Switch_Testbed

devices:
  Hfcl-Switch:
    alias: switch
    type: switch
    os: linux          # 'generic' causes KeyError:0 in unicon; use 'linux' for SSH-only devices
    platform: linux
    credentials:
      default:
        username: admin
        password: admin
    connections:
      cli:
        class: unicon.Unicon
        protocol: ssh
        ip: 192.168.180.146
        port: 22
        arguments:
          connection_timeout: 60
          ssh_options: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        settings:
          EXEC_TIMEOUT: 60
          GRACEFUL_DISCONNECT_WAIT_SEC: 2
