testbed:
  name: HFCL_Switch_Testbed

devices:
  Hfcl-Switch:
    alias: switch
    type: switch
    os: generic
    platform: hfcl

    credentials:
      default:
        username: admin
        password: admin

    connections:
      cli:
        protocol: ssh
        ip: 192.168.180.96
        port: 22
        arguments:
          connection_timeout: 30
          ssh_options: "-o StrictHostKeyChecking=no"
          init_exec_commands:
            - terminal length 0        # ← disables pagination
